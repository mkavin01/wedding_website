<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website in Progress</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 520px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 2rem;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    p {
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">In Progress</span>
    <p>Kavin <3 Lakshana E-invition site is in progress offline. </p>
    <p> தயவுசெய்து காத்திருங்கள்</p>
     <p>Revist in few days. Thanks for understanding</p>
  </main>
</body>
</html>
